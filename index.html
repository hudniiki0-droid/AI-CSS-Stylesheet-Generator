<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Builder with Theme Toggle</title>
    <style>
      :root {
        --bg: #f9fafb;
        --ink: #111827;
        --line: #e5e7eb;
        --accent: #2563eb;
      }
      [data-theme="dark"] {
        --bg: #111827;
        --ink: #f9fafb;
        --line: #374151;
        --accent: #3b82f6;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
      }
      button {
        background: var(--ink);
        color: var(--bg);
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover { opacity: 0.85; }
      .container { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 20px; }
      .box { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      textarea,input,select { width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);margin-bottom:10px;background:var(--bg);color:var(--ink); }
      pre { background: var(--line); color: var(--ink); padding: 10px; border-radius: 8px; }
    </style>
    <script>
      let darkMode = false;
      function toggleTheme() {
        darkMode = !darkMode;
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        const icon = document.getElementById('themeLabel');
        icon.textContent = darkMode ? '🌙 Dark Mode' : '☀️ Light Mode';
      }
      document.addEventListener('DOMContentLoaded', () => {
        document.documentElement.setAttribute('data-theme', 'light');
      });
    </script>
  </head>
  <body>
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h1>CSS Class & Stylesheet Builder</h1>
      <button onclick="toggleTheme()" id="themeLabel">☀️ Light Mode</button>
    </header>
    <div class="container">
      <div class="box">
        <h3>Settings</h3>
        <label>Scheme</label>
        <select><option>BEM</option><option>kebab-case</option></select>
        <label>Prefix</label>
        <input placeholder="ui" />
        <label>Block</label>
        <input placeholder="card" />
        <button>Generate</button>
      </div>
      <div class="box">
        <h3>Generated CSS</h3>
        <textarea rows="12" placeholder="Generated classes or CSS will appear here..."></textarea>
      </div>
      <div class="box">
        <h3>Preview</h3>
        <div style="border:1px solid var(--line);border-radius:8px;padding:10px;">
          <div style="font-weight:bold;">Header</div>
          <div>Body example text.</div>
          <button style="margin-top:10px;background:var(--accent);color:var(--bg);">Action</button>
        </div>
      </div>
    </div>
  </body>
  </html>
